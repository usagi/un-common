[package]
name = "un-i18n"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared i18n bridge for U.N. series applications: TOML source of truth on the Rust side, bulk-bundled to svelte-i18n on the frontend through a single Tauri command."
readme = "README.md"
keywords = ["i18n", "tauri", "svelte", "rust-i18n", "localization"]
categories = ["internationalization", "gui"]

[lib]
name = "un_i18n"
path = "src/lib.rs"

[features]
default = []
# Provide ready-made `#[tauri::command]` shims that pull a UnI18nStore out of
# Tauri state. Apps that need full control over their commands can leave this
# off and write their own thin wrappers.
tauri = ["dep:tauri"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rust-i18n = { workspace = true }
regex = { workspace = true }
sys-locale = { workspace = true }
unic-langid = { workspace = true }
tracing = { workspace = true }
tauri = { workspace = true, optional = true }

[lints]
workspace = true
